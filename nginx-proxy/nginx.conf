worker_processes auto;
pid /var/run/nginx.pid;
events {
    worker_connections 1024;
}
# Health-checker URL to get the latest provider list
env CONFIG_HEALTH_CHECKER_URL;
# custom local DNS server to use for resolving the provider list and the auth service
env CUSTOM_DNS;
# reload interval in seconds (grabs the latest provider list from CONFIG_HEALTH_CHECKER_URL)
env RELOAD_INTERVAL;
# Go Auth Service URL
env GO_AUTH_SERVICE_URL;
# Auth config file path
env AUTH_CONFIG_FILE;
# Seconds between lookups of the auth service address
env AUTH_RESOLVE_INTERVAL;
# "false" refuses a JWT token in the query string
env AUTH_ACCEPT_QUERY_TOKEN;
# Go Cache Service Socket (Unix socket)
env GO_CACHE_SOCKET;
http {
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;
    lua_package_path "/usr/local/openresty/nginx/lua/?.lua;/usr/local/openresty/lualib/?.lua;;";
    
    lua_shared_dict providers 10m;
    lua_shared_dict jwt_tokens 10m;  # Shared memory for JWT token validation
    lua_shared_dict stats 10m;       # Shared memory for metrics
    lua_shared_dict client_metrics 10m; # Client counters shared by workers
    lua_shared_dict client_routes 1m; # Configured metric routes independent of health

    # Answers to a puzzle per client address: /auth/solve (auth_locations.conf)
    # is limited by this zone. A wrong answer to a real puzzle costs the auth
    # service one Argon2 run.
    limit_req_zone $binary_remote_addr zone=auth_solve:10m rate=10r/s;
    
    client_body_buffer_size 10M;
    client_max_body_size 10M;
    access_log /dev/stdout;
    error_log /dev/stderr info;

    # Schedule periodic reload of the provider list
    init_worker_by_lua_file lua/init_worker.lua;
    
    server {
        listen 8080;
        
        # Add Prometheus metrics endpoint
        include metrics.conf;

        # Puzzle auth (proxy-common/auth/nginx): /auth/, /auth/solve and the
        # internal JWT token check auth_request points at
        include auth_locations.conf;

        # Cache metrics endpoints
        # Cache metrics endpoint - proxy to go-proxy-cache service
        location /metrics/cache {
            allow 172.16.0.0/12; allow 10.0.0.0/8; allow 127.0.0.1; deny all;
            access_log off;
            proxy_pass http://unix:/tmp/cache.sock:/metrics;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Main RPC endpoints with hybrid authentication
        location / {
            lua_need_request_body on;

            # Tell clients they may gzip request bodies (RFC 7694)
            add_header Accept-Encoding "gzip" always;
            
            # Hybrid authentication: satisfy either basic auth OR JWT token
            satisfy any;
            
            # 1) Basic Auth - .htpasswd
            auth_basic           "Restricted";
            auth_basic_user_file /etc/nginx/.htpasswd;
            
            # 2) Auth Request - JWT token
            auth_request         /_auth_token;

            # Tell a token client how much of its request limit is left. Empty,
            # and so not sent, for basic auth.
            auth_request_set     $auth_ratelimit_limit $sent_http_x_ratelimit_limit;
            auth_request_set     $auth_ratelimit_remaining $sent_http_x_ratelimit_remaining;
            add_header           X-RateLimit-Limit $auth_ratelimit_limit always;
            add_header           X-RateLimit-Remaining $auth_ratelimit_remaining always;
            
            # Remove WWW-Authenticate header to prevent browser popup
            header_filter_by_lua_block {
                if ngx.status == 401 then
                    ngx.header["WWW-Authenticate"] = nil
                end
            }
            
            # Serve the request using the provider list
            content_by_lua_file lua/request_handler.lua;
        }
    }
}
